name: Job Scout Tests
on:
  push:
    paths:
      - '*.py'
      - requirements.txt
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.py'
      - requirements.txt
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
