name: Linkareer Discord Bot Automation

on:
  schedule:
    # 매일 오전 9시(KST) 예정. GitHub 부하에 따라 실제 시작은 지연될 수 있습니다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: 미리보기 / send: 실제 전송 / baseline: 현재 공고를 전송 없이 처리'
        type: choice
        options: [dry-run, send, baseline]
        default: dry-run
        required: true

permissions:
  contents: read

concurrency:
  group: job-scout-delivery
  cancel-in-progress: false

jobs:
  run-bot:
    # 상태 파일을 저장하는 기본 브랜치에서만 실행합니다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: 라이브러리 설치
        run: python -m pip install -r requirements.txt

      - name: 오프라인 회귀 테스트
        run: python -m unittest discover -s tests -v

      - name: 크롤러 봇 실행
        id: bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          case "$MODE" in
            dry-run) python main.py --dry-run ;;
            baseline) python main.py --baseline ;;
            send) python main.py ;;
            *) echo 'Invalid mode'; exit 1 ;;
          esac

      - name: 상태 파일 복구용 백업
        if: ${{ !cancelled() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: job-scout-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sent_jobs.json
            pending_jobs.json
          retention-days: 30
          if-no-files-found: error

      - name: 발송 및 보류 기록 저장
        if: ${{ !cancelled() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure') && (github.event_name == 'schedule' || inputs.mode != 'dry-run') }}
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sent_jobs.json pending_jobs.json
          if git diff --cached --quiet; then
            echo 'No state changes'
            exit 0
          fi
          git commit -m "chore: persist notification delivery state"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort
              echo 'State conflict. Restore the state artifact before sending again.'
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo 'Push failed. Check contents: write / branch rules and recover the artifact.'
          exit 1
