name: Linkareer Discord Bot Automation

on:
  schedule:
    # 매 시간 정각마다 실행 (UTC 기준이므로 한국 시간 계산 필요 없이 정기적으로 실행됩니다)
    - cron: '0 * * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 실행 버튼을 누를 수 있게 해주는 옵션

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: 크롤러 봇 실행
      env:
        # 3단계에서 등록한 GitHub Secret 보안 주소를 파이썬 변수로 연결합니다.
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python main.py

    - name: 중복 방지 파일(sent_jobs.json) 변경사항 깃허브에 자동 저장
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add sent_jobs.json
        # 변경사항(새로 보낸 채용공고 기록)이 있을 때만 깃허브 저장소에 Push합니다.
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent_jobs.json" && git push)
